name: Update profile and featured projects

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: profile-generated-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Fetch public profile data
        run: node scripts/fetch-github-data.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate README and SVG assets
        run: node scripts/generate-assets.mjs

      - name: Validate generated assets
        run: node scripts/validate-assets.mjs

      - name: Commit changed profile assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/brand assets/generated/hero-dark.svg assets/generated/hero-light.svg assets/generated/hero-dark-static.svg assets/generated/hero-light-static.svg assets/generated/featured-projects-dark.svg assets/generated/featured-projects-light.svg assets/generated/tech-stack-dark.svg assets/generated/tech-stack-light.svg assets/generated/profile-status-dark.svg assets/generated/profile-status-light.svg assets/generated/profile-status-dark-static.svg assets/generated/profile-status-light-static.svg assets/cache/github-data.json assets/cache/fetch-status.json
          if git diff --cached --quiet; then
            echo 'No profile changes to commit.'
          else
            git commit -m 'chore(profile): refresh profile assets'
            git push
          fi
