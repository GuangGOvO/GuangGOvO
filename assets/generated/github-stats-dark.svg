<svg xmlns="http://www.w3.org/2000/svg" width="960" height="178" viewBox="0 0 960 178" role="img" aria-labelledby="title desc">
  <title id="title">GitHub public repository statistics</title><desc id="desc">Public repository count, stars across owned public repositories, and primary languages counted once per repository.</desc>
  <rect width="960" height="178" rx="16" fill="#161B22" stroke="#30363D" />
  <g><rect x="18" y="24" width="294" height="112" rx="14" fill="#0D1117" stroke="#30363D"/><circle cx="288" cy="43" r="3" fill="#3FB950"><animate attributeName="opacity" values=".3;.8;.3" dur="3s" repeatCount="indefinite" /></circle><text x="36" y="54" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">PUBLIC REPOSITORIES</text><text x="36" y="98" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="27" font-weight="700">8</text></g>
  <g><rect x="332" y="24" width="294" height="112" rx="14" fill="#0D1117" stroke="#30363D"/><circle cx="602" cy="43" r="3" fill="#3FB950"><animate attributeName="opacity" values=".3;.8;.3" dur="3s" repeatCount="indefinite" /></circle><text x="350" y="54" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">STARS · OWN PUBLIC REPOS</text><text x="350" y="98" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="27" font-weight="700">0</text></g>
  <g><rect x="646" y="24" width="294" height="112" rx="14" fill="#0D1117" stroke="#30363D"/><circle cx="916" cy="43" r="3" fill="#3FB950"><animate attributeName="opacity" values=".3;.8;.3" dur="3s" repeatCount="indefinite" /></circle><text x="664" y="54" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">PRIMARY LANGUAGES</text><text x="664" y="98" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700">JavaScript · C++ · TypeScript</text></g>
  <text x="22" y="162" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">all public repositories · primary language ranked by repository count · refreshed 2026-10-08</text>
