<svg xmlns="http://www.w3.org/2000/svg" width="960" height="286" viewBox="0 0 960 286" role="img" aria-labelledby="title desc">
  <title id="title">Workspace terminal welcome</title>
  <desc id="desc">Public profile details are added through configuration. Terminal-style welcome banner. A static fallback is available for reduced motion.</desc>
  <rect width="960" height="286" rx="18" fill="#FFFFFF" />
  <rect x="1" y="1" width="958" height="284" rx="17" fill="none" stroke="#D0D7DE" />
  <path d="M1 54h958" stroke="#D0D7DE" />
  <circle cx="27" cy="27" r="6" fill="#59636E" opacity=".55" />
  <circle cx="48" cy="27" r="6" fill="#59636E" opacity=".55" />
  <circle cx="69" cy="27" r="6" fill="#1A7F37" />
  <text x="90" y="32" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">Workspace / profile</text>
  <text x="42" y="94" fill="#1A7F37" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">guest@workspace:~$ ./welcome.sh</text>
  <text x="42" y="151" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="36" font-weight="700">Hello, World!</text>
  <text x="42" y="188" fill="#0969DA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">&gt; Public profile details are added through configuration.</text>
  <defs><clipPath id="typing-window"><rect x="41" y="205" width="474.3" height="23"></rect></clipPath></defs>
  <text x="42" y="223" clip-path="url(#typing-window)" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">Configure profile.config.json to add a short intro.</text>
  <rect x="520.3" y="207" width="8" height="18" rx="1" fill="#1A7F37"></rect>
  <text x="42" y="260" fill="#59636E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">Static image · no animation</text>
</svg>
